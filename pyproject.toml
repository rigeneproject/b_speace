[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b-speace"
version = "0.1.0"
description = "B-SPEACE — Biological/Bio-inspired computational layer for the SPEACE framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Rigene Project"}]
keywords = [
    "bio-inspired",
    "bioelectric",
    "organoid-intelligence",
    "wetware-in-the-loop",
    "cybernetics",
    "speace",
    "hybrid-quantum",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
qspeace = ["q-speace>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
bspace = "b_speace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["b_speace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=b_speace --cov-report=term-missing --cov-fail-under=70"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
strict_equality = true
